<?xml version="1.0" encoding="UTF-8"?>
<!-- Rig: a drone — quick but never instant, drifting a little on the wind.
     The clean arc is kept as a ghost and the flown line wanders gently either side of it. The drift
     crosses the ideal rather than running parallel to it, because a drone corrects: it is always
     coming back to the line, never settling off it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #fff; stroke-width: 1.25px; stroke-dasharray: 2 2; opacity: .35; }
      .cls-2 { fill: none; stroke: #8cd9ff; stroke-width: 2.25px; stroke-linecap: round; }
    </style>
  </defs>
  <path class="cls-1" d="M2,22 Q14,4 26,22"/>
  <path class="cls-2" d="M2,22 C5,17 5.5,13.5 9,11 C12,8.8 12,7.5 14,7.4 C16.5,7.3 16,9.5 19,11.5 C22.5,13.8 23,17 26,22"/>
</svg>
