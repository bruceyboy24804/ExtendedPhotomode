<?xml version="1.0" encoding="UTF-8"?>
<!-- Follow: the whole shot travels with the subject, and aims at it.
     Same scene again, but now the CAMERA has moved too — ghost where it was, solid where it went, the
     same displacement the subject made. Aim rotates the cone; Ride carries the camera. Drawing the
     camera's own ghost is what separates them, and it is the same ghost-means-before convention the
     whole-path row uses. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: #8cd9ff; opacity: .45; }
      .cls-2 { fill: #ffd933; }
      .cls-3 { fill: none; stroke: #fff; stroke-width: 1.5px; opacity: .4; }
      .cls-4 { fill: none; stroke: #fff; stroke-width: 1.25px; stroke-linecap: round; opacity: .55; }
      .cls-5 { fill: #fff; opacity: .55; }
    </style>
  </defs>
  <polygon class="cls-1" points="12 25 21.3 11.2 24.1 14.4"/>
  <circle class="cls-3" cx="4" cy="21" r="2.75"/>
  <g id="CameraMoves">
    <path class="cls-4" d="M6.9,22.2 L9.2,23.4"/>
  </g>
  <circle class="cls-2" cx="12" cy="25" r="3"/>
  <circle class="cls-3" cx="15" cy="11" r="2.75"/>
  <g id="SubjectMoves">
    <path class="cls-4" d="M18.5,9 L21.5,7.6"/>
    <polygon class="cls-5" points="24.5 6.2 20.7 5.7 21.8 9.4"/>
  </g>
  <circle class="cls-2" cx="24" cy="6.5" r="3"/>
</svg>
