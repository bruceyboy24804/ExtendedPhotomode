<?xml version="1.0" encoding="UTF-8"?>
<!-- Points: spread the points evenly along the curve by distance.
     Bunched ghosts above, evenly spaced points on the curve below, with equal tick gaps under them.
     The bunching is the point: uniform steps along a curve parameter crowd the samples where it
     bends, which is the trap CameraPath samples by arc length to avoid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #8cd9ff; stroke-width: 2px; stroke-linecap: round; }
      .cls-2 { fill: #ffd933; }
      .cls-3 { fill: none; stroke: #fff; stroke-width: 1.25px; opacity: .45; }
      .cls-4 { fill: none; stroke: #fff; stroke-width: 1.25px; stroke-linecap: round; opacity: .5; }
    </style>
  </defs>
  <g id="Bunched">
    <circle class="cls-3" cx="5" cy="6" r="2"/>
    <circle class="cls-3" cx="11" cy="6" r="2"/>
    <circle class="cls-3" cx="15" cy="6" r="2"/>
    <circle class="cls-3" cx="18" cy="6" r="2"/>
    <circle class="cls-3" cx="23" cy="6" r="2"/>
  </g>
  <path class="cls-1" d="M3,20 Q14,10 25,20"/>
  <circle class="cls-2" cx="3" cy="20" r="2.25"/>
  <circle class="cls-2" cx="8.5" cy="16.4" r="2.25"/>
  <circle class="cls-2" cx="14" cy="15" r="2.25"/>
  <circle class="cls-2" cx="19.5" cy="16.4" r="2.25"/>
  <circle class="cls-2" cx="25" cy="20" r="2.25"/>
  <g id="EvenGaps">
    <path class="cls-4" d="M3,25 L25,25"/>
    <path class="cls-4" d="M3,23.5 L3,26.5"/>
    <path class="cls-4" d="M14,23.5 L14,26.5"/>
    <path class="cls-4" d="M25,23.5 L25,26.5"/>
  </g>
</svg>
