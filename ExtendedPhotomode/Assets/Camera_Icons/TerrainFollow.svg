<?xml version="1.0" encoding="UTF-8"?>
<!-- Terrain mode: Follow. Same ridge again; the curve is the terrain's own outline offset by a
     constant clearance, so it runs parallel the whole way — the drone shot. Against TerrainFloor,
     which only lifts over the peak, the difference is the flat entry and exit. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 {
        fill: #fff;
        opacity: .22;
      }

      .cls-2 {
        fill: none;
        stroke: #fff;
        stroke-width: 1.5px;
        stroke-linejoin: round;
      }

      .cls-3 {
        fill: none;
        stroke: #8cd9ff;
        stroke-width: 2px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  <g id="Terrain">
    <path class="cls-1" d="M1,24 L9,24 L14,12 L19,19 L27,22 L27,27 L1,27 Z"/>
    <path class="cls-2" d="M1,24 L9,24 L14,12 L19,19 L27,22"/>
  </g>
  <g id="Curve">
    <path class="cls-3" d="M1,20 L9,20 L14,8 L19,15 L27,18"/>
  </g>
</svg>
