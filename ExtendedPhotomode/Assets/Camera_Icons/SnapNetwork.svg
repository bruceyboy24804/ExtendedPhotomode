<?xml version="1.0" encoding="UTF-8"?>
<!-- Snap mode: Network. Plan view: the two white road edges, the centreline the point is pulled onto,
     and the point itself sitting on it rather than where the click hit the road surface.

     This is CentreLine.svg redrawn on the set's 28x28 square. The original is 18x26.67, and a portrait
     viewBox among four square ones renders visibly narrower in the same button — the odd one out for
     no reason a reader could guess at. CentreLine.svg had this icon's language first; the rest of the
     snap set was drawn to match it, not the other way round. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 {
        fill: none;
        stroke: #fff;
        stroke-width: 1.5px;
        opacity: .55;
      }

      .cls-2 {
        fill: none;
        stroke: #8cd9ff;
        stroke-width: 2px;
        stroke-dasharray: 3 2.5;
      }

      .cls-3 {
        fill: #ffd933;
      }
    </style>
  </defs>
  <g id="Edges">
    <path class="cls-1" d="M7,1 L7,27"/>
    <path class="cls-1" d="M21,1 L21,27"/>
  </g>
  <g id="Centreline">
    <path class="cls-2" d="M14,1 L14,27"/>
  </g>
  <g id="Point">
    <circle class="cls-3" cx="14" cy="14" r="3.5"/>
  </g>
</svg>
