<?xml version="1.0" encoding="UTF-8"?>
<!-- Focus: leave focus exactly as the panel has it.
     The focus row is drawn along the optical axis — camera at the left, subject down the line — since
     focus is purely a question of DISTANCE. The focal plane is the blue bar crossing that axis, and
     Off is the one icon in the row that has no bar at all: nothing is being solved. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #fff; stroke-width: 1.25px; stroke-dasharray: 2 2; opacity: .45; }
      .cls-2 { fill: #ffd933; }
      .cls-3 { fill: none; stroke: #fff; stroke-width: 1.5px; opacity: .4; }
    </style>
  </defs>
  <path class="cls-1" d="M6,14 L25,14"/>
  <circle class="cls-2" cx="4" cy="14" r="3"/>
  <circle class="cls-3" cx="20" cy="14" r="3"/>
</svg>
