<?xml version="1.0" encoding="UTF-8"?>
<!-- Aim rail: fly the path now, without writing to the timeline.
     A play triangle, because a play triangle is already perfect and nothing would be gained by being
     clever. It is here as a custom file only so the row does not mix white vanilla line-art with the
     coloured set beside it — the triangle is vanilla's shape in this set's blue, with the path it
     plays sketched above so it reads as "fly THIS", not "start playback of the timeline". -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #fff; stroke-width: 1.5px; stroke-linecap: round; opacity: .45; }
      .cls-2 { fill: #ffd933; }
      .cls-3 { fill: #8cd9ff; }
    </style>
  </defs>
  <path class="cls-1" d="M4,10 Q14,3 24,10"/>
  <circle class="cls-2" cx="4" cy="10" r="1.75"/>
  <circle class="cls-2" cx="24" cy="10" r="1.75"/>
  <polygon class="cls-3" points="10 14 22 20 10 26"/>
</svg>
