<?xml version="1.0" encoding="UTF-8"?>
<!-- Rig: handheld — follows the action closely and is never quite still.
     The same arc again, but the line breaks into small irregular steps. Irregular on purpose: evenly
     spaced zigzag reads as a pattern, a texture, a saw blade. Only uneven jitter reads as a person
     holding something. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #fff; stroke-width: 1.25px; stroke-dasharray: 2 2; opacity: .35; }
      .cls-2 { fill: none; stroke: #8cd9ff; stroke-width: 2.25px; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>
  <path class="cls-1" d="M2,22 Q14,4 26,22"/>
  <path class="cls-2" d="M2,22 L3.6,17.6 L5.4,19.4 L7.5,13.8 L9.2,15.4 L11.4,9.6 L13.2,11.2 L15,7.4 L16.8,10.4 L18.8,9.2 L20.6,14.6 L22.3,13.2 L24,18.8 L26,22"/>
</svg>
