<?xml version="1.0" encoding="UTF-8"?>
<!-- Follow: keyframed position, but the camera turns to hold a moving subject in frame.
     Same scene, same camera in the same place — only the cone has swung across to where the subject
     actually is. Against FollowOff, which leaves the cone behind, the rotation is the entire content.
     The camera not moving is as important as the cone moving: this mode keeps the keyframed path. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: #8cd9ff; opacity: .45; }
      .cls-2 { fill: #ffd933; }
      .cls-3 { fill: none; stroke: #fff; stroke-width: 1.5px; opacity: .4; }
      .cls-4 { fill: none; stroke: #fff; stroke-width: 1.25px; stroke-linecap: round; opacity: .55; }
      .cls-5 { fill: #fff; opacity: .55; }
    </style>
  </defs>
  <polygon class="cls-1" points="5 23 20.4 8.6 22.6 12.4"/>
  <circle class="cls-2" cx="5" cy="23" r="3"/>
  <circle class="cls-3" cx="15" cy="11" r="2.75"/>
  <g id="Moves">
    <path class="cls-4" d="M18.5,9 L21.5,7.6"/>
    <polygon class="cls-5" points="24.5 6.2 20.7 5.7 21.8 9.4"/>
  </g>
  <circle class="cls-2" cx="24" cy="6.5" r="3"/>
</svg>
