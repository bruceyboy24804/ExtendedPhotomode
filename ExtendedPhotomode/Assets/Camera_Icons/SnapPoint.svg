<?xml version="1.0" encoding="UTF-8"?>
<!-- Snap mode: Point. Plan view. The dashed ring is the snap radius — the setting this mode reveals
     in the panel — and the path arriving from the left ends dead on the existing point rather than
     near it. That is how a closed loop meets itself with no gap, which is what the mode is for. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 {
        fill: none;
        stroke: #fff;
        stroke-width: 1.25px;
        stroke-dasharray: 2.5 2.5;
        opacity: .55;
      }

      .cls-2 {
        fill: none;
        stroke: #8cd9ff;
        stroke-width: 2px;
        stroke-linecap: round;
      }

      .cls-3 {
        fill: #ffd933;
      }
    </style>
  </defs>
  <g id="Radius">
    <circle class="cls-1" cx="16" cy="14" r="8"/>
  </g>
  <g id="Arrival">
    <path class="cls-2" d="M2,22 L16,14"/>
  </g>
  <g id="Point">
    <circle class="cls-3" cx="16" cy="14" r="3.5"/>
  </g>
</svg>
