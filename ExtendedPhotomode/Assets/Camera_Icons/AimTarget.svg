<?xml version="1.0" encoding="UTF-8"?>
<!-- Aim: keep the pinned subject framed.
     Same path and cameras; the cones converge on one marker. Convergence is the signal — Fixed's
     cones are parallel, Forward's splay apart, and these two meet.

     The marker is ringed so it reads as a pinned subject rather than as a fourth path point; the two
     mean different things and are the same yellow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #8cd9ff; stroke-width: 2px; stroke-linecap: round; }
      .cls-2 { fill: #8cd9ff; opacity: .45; }
      .cls-3 { fill: #ffd933; }
      .cls-4 { fill: #ffd933; stroke: #fff; stroke-width: 1.25px; }
    </style>
  </defs>
  <g id="Cones">
    <polygon class="cls-2" points="8.5 15.75 10.36 22.78 13.8 20.74"/>
    <polygon class="cls-2" points="19.5 15.75 14.2 20.74 17.64 22.78"/>
  </g>
  <path class="cls-1" d="M3,21 Q14,7 25,21"/>
  <circle class="cls-3" cx="3" cy="21" r="2"/>
  <circle class="cls-3" cx="25" cy="21" r="2"/>
  <circle class="cls-3" cx="8.5" cy="15.75" r="2.5"/>
  <circle class="cls-3" cx="19.5" cy="15.75" r="2.5"/>
  <circle class="cls-4" cx="14" cy="24.75" r="2.75"/>
</svg>
