<?xml version="1.0" encoding="UTF-8"?>
<!-- Obstacle mode: Warn. Same skyline and the same unchanged curve as ObstacleOff — because that is
     precisely what the mode does, it changes nothing about the path. The ONLY difference is that the
     obstructed stretch is drawn in the warning colour.

     That red is #ff4c4c, which is kBlockedColor in EPM_PathToolSystem, and the tool reserves it for
     exactly one meaning: "this stretch flies through something". Using any other red here would
     teach the wrong thing — the icon is a legend for what you will see in the world. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 {
        fill: #fff;
        opacity: .22;
      }

      .cls-2 {
        fill: none;
        stroke: #fff;
        stroke-width: 1.5px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .cls-3 {
        fill: none;
        stroke: #8cd9ff;
        stroke-width: 2px;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .cls-4 {
        fill: none;
        stroke: #ff4c4c;
        stroke-width: 2px;
        stroke-linecap: butt;
      }
    </style>
  </defs>
  <g id="Skyline">
    <path class="cls-1" d="M3,20 L8,20 L8,25 L3,25 Z"/>
    <path class="cls-1" d="M11,11 L18,11 L18,25 L11,25 Z"/>
    <path class="cls-1" d="M21,19 L26,19 L26,25 L21,25 Z"/>
    <path class="cls-2" d="M3,25 L3,20 L8,20 L8,25"/>
    <path class="cls-2" d="M11,25 L11,11 L18,11 L18,25"/>
    <path class="cls-2" d="M21,25 L21,19 L26,19 L26,25"/>
    <path class="cls-2" d="M1,25 L27,25"/>
  </g>
  <g id="Curve">
    <path class="cls-3" d="M1,17 L11,17"/>
    <path class="cls-4" d="M11,17 L18,17"/>
    <path class="cls-3" d="M18,17 L27,17"/>
  </g>
</svg>
