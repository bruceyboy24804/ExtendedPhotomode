<?xml version="1.0" encoding="UTF-8"?>
<!-- Framing: centred horizontally, sat low, with headroom above.
     The horizontal guide is the upper third rather than the centre line used by FramingCentre, so the
     space above the subject is measured rather than merely implied. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #fff; stroke-width: 1.5px; stroke-linejoin: round; opacity: .6; }
      .cls-2 { fill: none; stroke: #fff; stroke-width: 1px; stroke-dasharray: 2 2; opacity: .45; }
      .cls-3 { fill: #ffd933; }
    </style>
  </defs>
  <rect class="cls-1" x="3" y="8" width="22" height="12" rx="1.5"/>
  <path class="cls-2" d="M3,12 L25,12"/>
  <circle class="cls-3" cx="14" cy="16.5" r="3.25"/>
</svg>
