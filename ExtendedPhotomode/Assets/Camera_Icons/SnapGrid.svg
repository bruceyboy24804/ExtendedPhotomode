<?xml version="1.0" encoding="UTF-8"?>
<!-- Snap mode: Grid. Plan view; the point sits exactly on an intersection, which is the mode. The
     grid is white because white is the guide throughout this set. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 {
        fill: none;
        stroke: #fff;
        stroke-width: 1.25px;
        opacity: .5;
      }

      .cls-2 {
        fill: #ffd933;
      }
    </style>
  </defs>
  <g id="Grid">
    <path class="cls-1" d="M7,2 L7,26"/>
    <path class="cls-1" d="M14,2 L14,26"/>
    <path class="cls-1" d="M21,2 L21,26"/>
    <path class="cls-1" d="M2,7 L26,7"/>
    <path class="cls-1" d="M2,14 L26,14"/>
    <path class="cls-1" d="M2,21 L26,21"/>
  </g>
  <g id="Point">
    <circle class="cls-2" cx="14" cy="14" r="3.25"/>
  </g>
</svg>
