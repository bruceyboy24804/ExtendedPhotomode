<?xml version="1.0" encoding="UTF-8"?>
<!-- Selection: stamp the copied properties onto every selected point.
     The mirror of SelectionCopy — same card, same place, arrow reversed — but THREE points, because
     paste goes to the whole selection and copy comes from one. That count is the second signal after
     the arrow direction, and at 28px a pair needs two. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 {
        fill: #fff;
        opacity: .18;
      }

      .cls-2 {
        fill: none;
        stroke: #fff;
        stroke-width: 1.5px;
        stroke-linejoin: round;
      }

      .cls-3 {
        fill: none;
        stroke: #fff;
        stroke-width: 1px;
        stroke-linecap: round;
        opacity: .55;
      }

      .cls-4 {
        fill: none;
        stroke: #8cd9ff;
        stroke-width: 2px;
        stroke-linecap: round;
      }

      .cls-5 {
        fill: #8cd9ff;
      }

      .cls-6 {
        fill: #ff73bf;
      }
    </style>
  </defs>
  <g id="Card">
    <rect class="cls-1" x="9" y="2" width="10" height="10" rx="1.5"/>
    <rect class="cls-2" x="9" y="2" width="10" height="10" rx="1.5"/>
    <path class="cls-3" d="M11.5,5.5 L16.5,5.5"/>
    <path class="cls-3" d="M11.5,8.5 L16.5,8.5"/>
  </g>
  <g id="Stamp">
    <path class="cls-4" d="M14,13.5 L14,16.5"/>
    <polygon class="cls-5" points="14 20 10.75 16 17.25 16"/>
  </g>
  <g id="Selected">
    <circle class="cls-6" cx="6" cy="24" r="3"/>
    <circle class="cls-6" cx="14" cy="24" r="3"/>
    <circle class="cls-6" cx="22" cy="24" r="3"/>
  </g>
</svg>
