<?xml version="1.0" encoding="UTF-8"?>
<!-- Focus: ramp focus from the subject to a second point across the shot.
     Two planes on the same axis, the near one solid and the far one ghosted, with an arrow carrying
     focus from one to the other. Two subjects is the signal: a rack pull needs somewhere to pull TO,
     and that second point is the thing FocusTrack does not have.

     NOTE for whoever wires this up: FocusMode.Rack currently has no way to set its second target
     (m_RackTarget is never assigned), so it behaves identically to Track in play. The icon draws the
     intent, not today's behaviour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <defs>
    <style>
      .cls-1 { fill: none; stroke: #fff; stroke-width: 1.25px; stroke-dasharray: 2 2; opacity: .45; }
      .cls-2 { fill: #ffd933; }
      .cls-3 { fill: none; stroke: #8cd9ff; stroke-width: 2px; stroke-linecap: round; }
      .cls-4 { fill: none; stroke: #8cd9ff; stroke-width: 1.5px; stroke-linecap: round; opacity: .4; }
      .cls-5 { fill: #8cd9ff; }
      .cls-6 { fill: none; stroke: #fff; stroke-width: 1.5px; opacity: .45; }
    </style>
  </defs>
  <path class="cls-1" d="M6,14 L26,14"/>
  <path class="cls-3" d="M12,7 L12,21"/>
  <path class="cls-4" d="M23,7 L23,21"/>
  <circle class="cls-2" cx="4" cy="14" r="3"/>
  <circle class="cls-2" cx="12" cy="14" r="3"/>
  <circle class="cls-6" cx="23" cy="14" r="2.75"/>
  <g id="Ramp">
    <path class="cls-3" d="M13.5,25 L21,25"/>
    <polygon class="cls-5" points="23.5 25 20 23.2 20 26.8"/>
  </g>
</svg>
